<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解体概算チェック（簡易版）</title>
</head>
<body>

<h2>解体概算チェック（簡易版）</h2>
<p>現地確認前の一次判断用の簡易概算ツールです</p>

<input id="area" type="number" placeholder="延床面積㎡"><br><br>
<input id="year" type="number" placeholder="築年数（年）"><br><br>

<button onclick="calc()">概算を出す</button>

<div id="result" style="margin-top:20px;"></div>

    <div id="paidBtnWrap" style="display:none; margin-top:20px; text-align:center;">
  <a href="/paid" style="
    display:inline-block;
    background:#2563eb;
    color:#fff;
    padding:12px 20px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
  ">
    詳細な概算を見る（有料版）
  </a>

  <p style="font-size:13px; color:#6b7280; margin-top:8px;">
    構造・内外装・重機条件まで反映した詳細版です
  </p>
</div>
<script>
function calc() {
    fetch("/calculate", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            area: document.getElementById("area").value,
            year: document.getElementById("year").value
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").innerHTML =
            
    document.getElementById("paidBtnWrap").style.display = "block";
})
            "概算：" + data.price_min.toLocaleString() + "〜" + data.price_max.toLocaleString() + "円<br><br>" +
            "【主な要因】<br>" +
            data.reasons.join("<br>") + "<br><br>" +
            "<span style='font-size:12px;color:gray;'>" +
            "※本結果は延床面積と築年数から想定した簡易概算です<br>" +
            "実際の作業条件・搬出条件により変動します<br>" +
            "手解体割合が極端に高い場合は上限レンジを超える可能性があります<br>" +
            "築年数によっては石綿含有建材が使用されている可能性があります<br>" +
            "※※石綿（アスベスト）含有建材がある場合は対象外です<br>" +
            "※実際の費用は地域や処分場により大きく変動します" +
            "</span>";
    })
    .catch(error => {
        document.getElementById("result").innerHTML =
            "<span style='color:red;'>入力内容を確認してください</span>";
        console.error(error);
    });
}
</script>

</body>
</html>
