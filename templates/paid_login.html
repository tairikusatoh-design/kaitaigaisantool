<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>有料版ログイン</title>
</head>
<body style="font-family:sans-serif; background:#f5f7fb; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0;">
  <div style="background:#fff; padding:24px; border-radius:16px; border:1px solid #ddd; width:320px; text-align:center;">
    <h2 style="margin-top:0;">有料版</h2>
    <p style="color:#666; font-size:14px;">パスワードを入力してください</p>

    {% if error %}
      <p style="color:red; font-size:13px;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/paid">
      <input type="password" name="password" placeholder="パスワード"
             style="width:100%; padding:10px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box;">
      <br><br>
      <button type="submit"
              style="width:100%; padding:10px; background:#2563eb; color:#fff; border:none; border-radius:8px; font-weight:bold;">
        入る
      </button>
    </form>
  </div>
</body>
</html>
